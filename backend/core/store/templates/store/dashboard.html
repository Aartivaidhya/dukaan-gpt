<!DOCTYPE html>
<html>
<head>
<title>Dukaan-GPT - Aarti</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:system-ui;background:#f1f5f9;margin:0;padding:20px}
.card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px #0001;display:inline-block;margin:10px;min-width:150px}
.btn{background:#16a34a;color:white;border:0;padding:10px 16px;border-radius:8px;cursor:pointer}
.btn2{background:#0f2b26;color:white;border:0;padding:10px 16px;border-radius:8px;cursor:pointer;margin-left:8px}
#m{position:fixed;top:0;left:0;width:100%;height:100%;background:#0008;display:none;align-items:center;justify-content:center}
.box{background:white;padding:20px;border-radius:12px;width:300px}
input{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
</style>
</head>
<body>
<h2>🏪 Dukaan-GPT - Aarti Vaidhya</h2>

<div class="card">Total Stock: <b id="s">60</b></div>
<div class="card">Total Items: <b id="it">2</b></div>
<div class="card">Aaj ka Profit: <b>₹2,450</b></div>

<br><br>
<button class="btn" onclick="document.getElementById('m').style.display='flex'">+ Add Item</button>
<button class="btn2" onclick="startVoice()">🎤 Bolke Add Karo</button>

<div id="list" style="margin-top:20px"></div>

<div id="m"><div class="box">
<h3>Add Item</h3>
<input id="n" placeholder="Item Name (Ex: Parle-G)">
<input id="q" type="number" placeholder="Quantity (Ex: 10)">
<button class="btn" onclick="add()">Save</button>
<button class="btn2" onclick="document.getElementById('m').style.display='none'">Close</button>
</div></div>

<script>
let stock = 60;
let items = 2;

function add(){
  let name = document.getElementById('n').value;
  let qty = parseInt(document.getElementById('q').value || 0);
  if(!name) return alert("Naam likho");
  stock += qty;
  items++;
  document.getElementById('s').innerText = stock;
  document.getElementById('it').innerText = items;
  document.getElementById('list').innerHTML += `<div class="card">${name} - ${qty}</div>`;
  document.getElementById('m').style.display='none';
  document.getElementById('n').value='';
  document.getElementById('q').value='';
}

function startVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert("Please open in Chrome"); return; }
  const rec = new SR();
  rec.lang = 'hi-IN';
  rec.start();
  alert("Bolo... sun raha hu 🎤");
  rec.onresult = (e)=>{
    let text = e.results[0][0].transcript;
    document.getElementById('n').value = text;
    document.getElementById('m').style.display='flex';
  }
}
</script>
</body>
</html>
