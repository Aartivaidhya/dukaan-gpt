<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dukaan-GPT | Dhar</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
body{font-family:'Poppins',sans-serif; background:#FFF8F0;}
.navbar{background:linear-gradient(90deg,#FF6B00,#FF9A00);}
.card-stat{border:none; border-radius:20px; transition:0.3s;}
.card-stat:hover{transform:translateY(-5px); box-shadow:0 10px 20px rgba(0,0,0,0.1) !important;}
.card-profit{background:#122620; color:white;}
.badge-cat{background:#FFE9D0; color:#FF6B00; border-radius:20px; padding:6px 12px; font-weight:600;}
.table-card{border-radius:20px; border:none;}
</style>
</head>
<body>

<nav class="navbar p-3 mb-4 shadow-sm">
  <div class="container d-flex justify-content-between">
    <span class="text-white fw-bold fs-5"><i class="fa-solid fa-store me-2"></i>Dukaan-GPT | Dhar</span>
    <span class="text-white small">Welcome, Aarti</span>
  </div>
</nav>

<div class="container pb-5">
  <div class="row g-3 mb-4">
    <div class="col-6 col-lg-4">
      <div class="card card-stat p-4 shadow-sm h-100 bg-white">
        <div class="d-flex justify-content-between align-items-center">
          <div><h2 class="fw-bold mb-0">50</h2><small class="text-muted">Total Stock</small></div>
          <div class="p-3 rounded-circle" style="background:#FFF0E0;"><i class="fa-solid fa-boxes-stacked text-warning fs-4"></i></div>
        </div>
      </div>
    </div>
    <div class="col-6 col-lg-4">
      <div class="card card-stat p-4 shadow-sm h-100 bg-white">
        <div class="d-flex justify-content-between align-items-center">
          <div><h2 class="fw-bold mb-0">1</h2><small class="text-muted">Total Items</small></div>
          <div class="p-3 rounded-circle" style="background:#E6F4EA;"><i class="fa-solid fa-bag-shopping text-success fs-4"></i></div>
        </div>
      </div>
    </div>
    <div class="col-12 col-lg-4">
      <div class="card card-stat card-profit p-4 shadow h-100">
        <div class="d-flex justify-content-between align-items-center">
          <div><h2 class="fw-bold mb-0">₹ 2,450</h2><small class="opacity-75">Aaj ka Profit</small></div>
          <div class="p-3 rounded-circle bg-white bg-opacity-25"><i class="fa-solid fa-chart-line fs-4"></i></div>
        </div>
      </div>
    </div>
  </div>

  <div class="card table-card shadow-sm">
    <div class="card-body p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">Aapki Dukaan ka Stock</h5>
        <a href="/admin/" class="btn btn-sm text-white px-3 py-1" style="background:#FF6B00; border-radius:20px;">+ Add Item</a>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light"><tr><th>Item</th><th>Category</th><th>Stock</th><th>Price</th></tr></thead>
          <tbody>
            <tr><td class="fw-semibold">parle-g</td><td><span class="badge-cat">biscuit</span></td><td>50</td><td class="fw-bold">₹10</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <p class="text-center text-muted small mt-4">Made with ❤️ in Dhar, MP for Kirana Stores</p>
</div>
</body>
</html>
