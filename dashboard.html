<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Dukaan-GPT</title>
<style>body{margin:0;font-family:Poppins;background:#FFF8F0}.nav{background:#FF6B00;color:#fff;padding:15px 25px;display:flex;justify-content:space-between;font-weight:bold}.cards{display:flex;gap:15px;padding:20px;flex-wrap:wrap}.card{background:#fff;border-radius:16px;padding:20px;flex:1;min-width:150px;box-shadow:0 4px 10px #0001}.stock{background:#fff;margin:0 20px;border-radius:16px;padding:20px}.btn{background:#FF6B00;color:#fff;border:0;padding:8px 16px;border-radius:20px;cursor:pointer;font-weight:600}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}#m{display:none;position:fixed;inset:0;background:#0005;justify-content:center;align-items:center}.b{background:#fff;padding:20px;border-radius:15px;width:90%;max-width:350px}.b input{width:100%;padding:10px;margin:7px 0;border:1px solid #ddd;border-radius:8px}</style>
</head>
<body>
<div class="nav"><span>🏪 Dukaan-GPT | Dhar</span><span>Welcome, Aarti</span></div>
<div class="cards"><div class="card"><div><h2 id="a">50</h2><small>Total Stock</small></div><div>📦</div></div><div class="card"><div><h2 id="b">1</h2><small>Total Items</small></div><div>👜</div></div><div class="card" style="background:#0f2b26;color:#fff"><div><h2>₹2,450</h2><small>Aaj ka Profit</small></div></div></div>
<div class="stock"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3>Aapki Dukaan ka Stock</h3><button class="btn" onclick="m.style.display='flex'">+ Add Item</button></div><table><thead><tr><th>Item</th><th>Stock</th><th>Price</th></tr></thead><tbody id="t"><tr><td><b>parle-g</b></td><td>50</td><td>₹10</td></tr></tbody></table></div>
<div id="m"><div class="b"><h3>Naya Item</h3><input id="n" placeholder="Naam e.g. Good Day"><input id="s" type="number" placeholder="Stock e.g. 100"><input id="p" type="number" placeholder="Price e.g. 20"><div style="display:flex;gap:10px;margin-top:10px"><button class="btn" style="flex:1" onclick="add()">Add Karo</button><button class="btn" style="flex:1;background:#eee;color:#333" onclick="m.style.display='none'">Cancel</button></div></div></div>
<script>
function add(){
let name=document.getElementById('n').value||'New Item';
let st=parseInt(document.getElementById('s').value)||10;
let pr=parseInt(document.getElementById('p').value)||10;
document.getElementById('t').innerHTML+=`<tr><td><b>${name}</b></td><td>${st}</td><td>₹${pr}</td></tr>`;
document.getElementById('a').innerText=parseInt(document.getElementById('a').innerText)+st;
document.getElementById('b').innerText=parseInt(document.getElementById('b').innerText)+1;
document.getElementById('m').style.display='none';
}
</script>
</body>
</html>
