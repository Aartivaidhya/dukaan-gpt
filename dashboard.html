<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dukaan-GPT | Dhar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#FFF6EC;min-height:100vh}
.nav{background:#FF6A00;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.nav b{font-size:16px}.nav span{font-size:14px;opacity:.95}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px}
@media(max-width:700px){.cards{grid-template-columns:1fr}}
.card{background:#fff;border-radius:20px;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 20px rgba(0,0,0,.04);border:1px solid #ffe6cc}
.card h1{font-size:32px;line-height:1}.card p{color:#7a6a5a;font-size:13px;margin-top:6px;font-weight:500}
.card.dark{background:#112F2B;color:#fff;border-color:#112F2B}.card.dark p{color:#9ED8C3}
.icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:#FFF0E0}.dark.icon{background:#1A413B}

.stock{background:#fff;border-radius:20px;padding:0;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.04);border:1px solid #ffe6cc}
.stock-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;flex-wrap:wrap;gap:12px}
.stock-head h3{font-size:18px}
.actions{display:flex;gap:10px}
.btn{border:0;padding:11px 18px;border-radius:999px;font-weight:700;cursor:pointer;font-size:13px;transition:.2s}
.btn:active{transform:scale(.96)}
.btn-voice{background:#112F2B;color:#fff}.btn-add{background:#FF6A00;color:#fff}
table{width:100%;border-collapse:collapse}th{font-size:12px;color:#9a8a7a;font-weight:500;padding:12px 22px;text-align:left;background:#FFFBF6;border-top:1px solid #fff0e0;border-bottom:1px solid #fff0e0}
td{padding:16px 22px;font-size:14px;font-weight:600;border-bottom:1px solid #fff0e0}
td span{color:#7a6a5a;font-weight:500}
#m{position:fixed;inset:0;background:rgba(17,47,43,.4);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
.box{background:#fff;width:100%;max-width:380px;border-radius:24px;padding:24px;box-shadow:0 20px 40px rgba(0,0,0,.15)}
.box h3{margin-bottom:14px}input{width:100%;padding:13px 14px;border:1px solid #ffe0c2;border-radius:14px;margin:7px 0;outline:none;font-size:14px}input:focus{border-color:#FF6A00}
</style>
</head>
<body>
<div class="nav"><b>🏪 Dukaan-GPT | Dhar</b><span>Welcome, Aarti</span></div>
<div class="wrap">
<div class="cards">
<div class="card"><div><h1 id="a">50</h1><p>Total Stock</p></div><div class="icon">📦</div></div>
<div class="card"><div><h1 id="b">1</h1><p>Total Items</p></div><div class="icon">👜</div></div>
<div class="card dark"><div><h1>₹2,450</h1><p>Aaj ka Profit</p></div><div class="icon">💰</div></div>
</div>

<div class="stock">
<div class="stock-head">
<h3>Aapki Dukaan ka Stock</h3>
<div class="actions">
<button class="btn btn-voice" onclick="startVoice()">🎙️ Bolke</button>
<button class="btn btn-add" onclick="document.getElementById('m').style.display='flex'">+ Add Item</button>
</div>
</div>
<table><thead><tr><th>Item</th><th>Stock</th><th>Price</th></tr></thead>
<tbody id="t"><tr><td>parle-g</td><td>50</td><td>₹10</td></tr></tbody></table>
</div>
</div>

<div id="m"><div class="box">
<h3>Naya Item</h3>
<input id="n" placeholder="Naam bolo - e.g. Good Day">
<input id="s" type="number" placeholder="Stock kitna?">
<input id="p" type="number" placeholder="Price kya?">
<div style="display:flex;gap:10px;margin-top:12px"><button class="btn btn-add" style="flex:1" onclick="add()">Save Karo</button><button class="btn" style="flex:1;background:#f3e9de" onclick="document.getElementById('m').style.display='none'">Band Karo</button></div>
</div></div>

<script>
function add(){
let name=document.getElementById('n').value||'New Item';
let st=parseInt(document.getElementById('s').value)||10;
let pr=parseInt(document.getElementById('p').value)||10;
document.getElementById('t').innerHTML+=`<tr><td>${name}</td><td>${st}</td><td>₹${pr}</td></tr>`;
document.getElementById('a').innerText=parseInt(document.getElementById('a').innerText)+st;
document.getElementById('b').innerText=parseInt(document.getElementById('b').innerText)+1;
document.getElementById('m').style.display='none';
document.getElementById('n').value='';document.getElementById('s').value='';document.getElementById('p').value='';
}
function startVoice(){
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){alert("Chrome me kholo");return;}
const rec=new SR();rec.lang='hi-IN';rec.start();
const b=document.querySelector('.btn-voice');b.innerText='🎧 Sun raha hu...';
rec.onresult=(e)=>{document.getElementById('m').style.display='flex';document.getElementById('n').value=e.results[0][0].transcript;b.innerText='🎙️ Bolke';};
rec.onend=()=>{b.innerText='🎙️ Bolke';};
}
</script>
</body></html>
